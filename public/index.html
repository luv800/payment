<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Hungerr Station | Food Delivery & Restaurant Discovery</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
tailwind.config={theme:{screens:{xs:'420px',sm:'640px',md:'768px',lg:'1024px',xl:'1280px'},extend:{colors:{zomato:{red:'#E23744',redHover:'#C82531',redSoft:'#FCEECF',dark:'#1C1C1C',grayBg:'#F8F8F8',border:'#E8E8E8',green:'#24963F',gold:'#FFB400'},swiggy:{orange:'#FC8019',orangeHover:'#E26D0A'}},fontFamily:{sans:['Plus Jakarta Sans','Inter','sans-serif']},boxShadow:{'zomato-lg':'0 12px 30px rgba(0,0,0,.12)',float:'0 10px 25px -5px rgba(226,55,68,.3)'}}}}
</script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
html,body{overflow-x:hidden;width:100%}
body{background:#F8F8F8;min-height:100%}
#cta{bottom:calc(4.5rem + env(safe-area-inset-bottom,0px))}
@media (min-width:768px){#cta{bottom:1.5rem}}
#preloader{position:fixed;inset:0;z-index:100;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .5s ease,visibility .5s ease}
#preloader.pl-hide{opacity:0;visibility:hidden;pointer-events:none}
.pl-ring{position:absolute;inset:0;border-radius:9999px;border:4px solid #FCEECF;border-top-color:#E23744;animation:plSpin .9s linear infinite}
@keyframes plSpin{to{transform:rotate(360deg)}}
.sv{position:fixed;inset:0;z-index:55;visibility:hidden;transition:visibility 0s .45s}
.sv.open{visibility:visible;transition-delay:0s}
.sv-ov{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;transition:opacity .35s ease}
.sv.open .sv-ov{opacity:1}
.sv-panel{position:absolute;top:0;right:0;bottom:0;width:100%;max-width:24rem;background:#fff;display:flex;flex-direction:column;transform:translateX(104%);transition:transform .45s cubic-bezier(.22,1,.36,1);box-shadow:-14px 0 34px rgba(0,0,0,.2)}
.sv.open .sv-panel{transform:none}
</style>
</head>
<body class="bg-zomato-grayBg text-zomato-dark font-sans antialiased pb-24 md:pb-0">

<!-- Preloader -->
<div id="preloader" role="status" aria-live="polite">
 <div class="relative w-24 h-24 flex items-center justify-center">
   <span class="pl-ring"></span>
   <div class="w-20 h-20 rounded-full bg-black text-white flex items-center justify-center font-black text-2xl border-2 border-zomato-red">HS</div>
 </div>
 <div class="font-extrabold text-xl text-zomato-dark">Hungerr <b class="text-zomato-red">Station</b></div>
</div>

<!-- Header -->
<header class="sticky z-40 bg-white border-b border-zomato-border shadow-sm top-0">
 <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 sm:h-20 flex items-center justify-between gap-4">
  <div class="flex items-center gap-3">
   <div class="w-12 h-12 rounded-full bg-black text-white font-black flex items-center justify-center border-2 border-zomato-red text-sm">HS</div>
   <span class="font-extrabold text-base sm:text-lg">Hungerr<span class="text-zomato-red">Station</span></span>
  </div>
  <div class="flex items-center gap-3">
   <button onclick="toggleSaved()" class="p-2.5 rounded-xl bg-zomato-grayBg border border-zomato-border relative" aria-label="Saved Items">
     <i class="fa-regular fa-heart"></i>
     <span id="wCount" class="hidden absolute -top-1 -right-1 bg-zomato-red text-white text-[9px] font-black w-4 h-4 rounded-full flex items-center justify-center">0</span>
   </button>
   <button onclick="toggleCart(true)" class="flex items-center gap-2 bg-zomato-red text-white font-extrabold px-4 py-2.5 rounded-2xl text-xs uppercase shadow-float">
     <i class="fa-solid fa-bag-shopping"></i>
     <span>Cart</span>
     <span id="cCount" class="bg-white text-zomato-red text-[11px] font-black px-2 py-0.5 rounded-lg">0</span>
   </button>
  </div>
 </div>
</header>

<!-- Categories -->
<section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-6">
 <div class="flex items-center justify-between mb-3"><h3 class="text-lg font-black">Explore Categories</h3></div>
 <div id="rail" class="flex gap-3 overflow-x-auto no-scrollbar py-2"></div>
</section>

<!-- Menu Listing -->
<main id="menu" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8"></main>

<!-- Cart Drawer -->
<div id="drawer" class="hidden fixed inset-0 z-50">
 <div class="absolute inset-0 bg-black/50" onclick="toggleCart(false)"></div>
 <aside class="absolute right-0 top-0 bottom-0 w-full max-w-sm bg-white flex flex-col">
  <div class="flex items-center justify-between p-4 border-b border-zomato-border">
    <h4 class="font-black text-lg">Your Cart</h4>
    <button onclick="toggleCart(false)" class="p-2 text-gray-500" aria-label="Close Cart"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <div id="cItems" class="flex-1 overflow-y-auto p-4 space-y-2"></div>
  <div class="p-4 border-t border-zomato-border space-y-3 text-xs font-bold">
   <div class="flex justify-between text-gray-500"><span>Subtotal</span><span id="cSubtotal">₹0</span></div>
   <div class="flex justify-between text-gray-500"><span>Delivery Fee</span><span id="cFee">₹25</span></div>
   <div class="flex justify-between text-base font-black"><span>Total</span><span id="cTotal">₹0</span></div>
   <button id="checkoutBtn" onclick="openPaymentModal()" class="w-full bg-zomato-red text-white font-extrabold text-sm py-3.5 rounded-2xl shadow-float">Proceed to Pay</button>
  </div>
 </aside>
</div>

<!-- Payment Modal (UPI & COD) -->
<div id="payModal" class="hidden fixed inset-0 z-50 items-center justify-center p-4">
 <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closePaymentModal()"></div>
 <div class="relative bg-white rounded-3xl p-6 w-full max-w-sm space-y-4 shadow-2xl z-10 text-center">
  <div class="flex items-center justify-between pb-2 border-b">
    <h4 class="font-black text-lg text-gray-900">Scan & Pay with any UPI</h4>
    <button onclick="closePaymentModal()" class="p-1 text-gray-400 hover:text-gray-600" aria-label="Close Payment"><i class="fa-solid fa-xmark text-lg"></i></button>
  </div>

  <div id="payInitView" class="space-y-4">
    <div class="bg-red-50 text-zomato-red rounded-2xl p-4 flex justify-between items-center text-sm font-black">
      <span>Amount to Pay:</span>
      <span id="modalPayTotal" class="text-xl">₹0</span>
    </div>
    
    <div class="space-y-2 text-left">
      <label class="flex items-center gap-3 p-3 rounded-2xl border-2 border-zomato-red bg-red-50/40 cursor-pointer">
        <input type="radio" name="payMethod" value="youpi" checked class="text-zomato-red focus:ring-0">
        <div class="flex-1">
          <p class="font-black text-xs text-gray-900">Instant UPI QR / Intent</p>
          <p class="text-[10px] text-gray-500 font-bold">GPay, PhonePe, Paytm, CRED, BHIM</p>
        </div>
        <i class="fa-solid fa-bolt text-amber-500 text-base"></i>
      </label>
      <label class="flex items-center gap-3 p-3 rounded-2xl border border-gray-200 cursor-pointer">
        <input type="radio" name="payMethod" value="cod" class="text-zomato-red focus:ring-0">
        <div class="flex-1">
          <p class="font-black text-xs text-gray-900">Cash on Delivery</p>
          <p class="text-[10px] text-gray-500 font-bold">Pay cash when food arrives</p>
        </div>
        <i class="fa-solid fa-money-bill-wave text-emerald-600 text-base"></i>
      </label>
    </div>

    <button id="confirmPayBtn" onclick="payNow()" class="w-full bg-zomato-red text-white font-extrabold text-sm py-3.5 rounded-2xl shadow-float flex items-center justify-center gap-2">
      <span>Pay Now</span>
      <i class="fa-solid fa-arrow-right"></i>
    </button>
  </div>

  <!-- Dynamic QR / Direct Intent Pay View -->
  <div id="payQrView" class="hidden space-y-4">
    <p class="text-xs text-gray-500 font-bold">Scan this QR from any UPI App</p>
    <div class="bg-white p-3 rounded-2xl border-2 border-dashed border-gray-200 inline-block shadow-sm">
      <img id="qrCodeImg" src="" alt="UPI QR" class="w-48 h-48 mx-auto object-contain">
    </div>

    <!-- Mobile Deep Link Intent -->
    <a id="upiIntentBtn" href="#" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-xs py-3 rounded-xl flex items-center justify-center gap-2 shadow">
      <i class="fa-solid fa-mobile-screen"></i>
      <span>Open in UPI App (GPay/PhonePe)</span>
    </a>

    <!-- Manual UTR Entry -->
    <div class="pt-2 border-t space-y-2">
      <input id="inputUtr" type="text" placeholder="Enter 12-digit UPI Ref / UTR (Optional)" class="w-full text-xs font-mono border rounded-xl px-3 py-2 text-center focus:outline-none focus:border-zomato-red">
      <button onclick="submitUtrVerification()" class="w-full bg-zomato-dark text-white font-extrabold text-xs py-2.5 rounded-xl">
        I Have Paid
      </button>
    </div>
  </div>
 </div>
</div>

<!-- Order Track Confirmation Modal -->
<div id="track" class="hidden fixed inset-0 z-50 items-center justify-center p-4">
 <div class="absolute inset-0 bg-black/50"></div>
 <div class="relative bg-white rounded-3xl p-6 w-full max-w-sm space-y-4 shadow-zomato-lg">
  <div class="text-center space-y-1">
    <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-xl"><i class="fa-solid fa-check"></i></div>
    <h4 class="font-black text-lg">Order Confirmed!</h4>
    <p id="trackOrderId" class="text-xs text-gray-500 font-bold">Order ID: #HS-0</p>
  </div>
  <div class="border rounded-2xl p-3 bg-gray-50 text-xs font-bold space-y-1">
    <div class="flex justify-between"><span>Payment Status:</span><span id="trackStatus" class="text-emerald-600 font-black">PAID</span></div>
    <div class="flex justify-between"><span>UTR / Ref:</span><span id="trackUtr" class="text-gray-600 font-mono text-[10px]">-</span></div>
  </div>
  <button onclick="document.getElementById('track').classList.add('hidden')" class="w-full bg-zomato-dark text-white font-extrabold text-xs py-3 rounded-xl">Close</button>
 </div>
</div>

<script>
const CATS = [
  {id:'all', name:'All Dishes', icon:'🍽️'},
  {id:'street-food', name:'Street Food', icon:'🥘'},
  {id:'momos', name:'Momos', icon:'🥟'},
  {id:'fries', name:'Loaded Fries', icon:'🍟'},
  {id:'sandwich', name:'Sandwich', icon:'🥪'},
  {id:'cold-beverages', name:'Cold Drinks', icon:'🥤'}
];

const DISHES = [
  {id:'sf1', cat:'street-food', name:'Classic Mumbai Vada Pav', price:40, desc:'Spicy batata vada in fresh pav with sweet and dry garlic chutney.', rating:'4.8', votes:340},
  {id:'sf2', cat:'street-food', name:'Cheese Burst Vada Pav', price:65, desc:'Crispy vada stuffed with melted mozzarella cheese.', rating:'4.9', votes:210},
  {id:'fr1', cat:'fries', name:'Peri Peri Masala Fries', price:99, desc:'Crispy French fries tossed in authentic spicy peri-peri dust.', rating:'4.9', votes:520},
  {id:'mo1', cat:'momos', name:'Veg Steamed Momos (6 Pcs)', price:70, desc:'Dumplings loaded with finely chopped vegetables and herbs.', rating:'4.7', votes:410},
  {id:'sw1', cat:'sandwich', name:'Bombay Masala Grilled Sandwich', price:100, desc:'Potato masala, cucumber, tomatoes and mint chutney.', rating:'4.7', votes:320},
  {id:'cb1', cat:'cold-beverages', name:'Cold Coffee with Ice Cream', price:90, desc:'Rich blended coffee topped with vanilla ice cream.', rating:'4.8', votes:450}
];

let cart = JSON.parse(localStorage.getItem('hs_cart') || '[]');
let saved = JSON.parse(localStorage.getItem('hs_saved') || '[]');
let currentActiveOrderId = '';
let currentCat = 'all';

document.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => document.getElementById('preloader')?.classList.add('pl-hide'), 300);
  renderCategories();
  renderMenu();
  updateCartUI();
});

function renderCategories() {
  const rail = document.getElementById('rail');
  if (!rail) return;
  rail.innerHTML = CATS.map(c => `
    <button onclick="setCategory('${c.id}')" class="flex flex-col items-center gap-1.5 p-3 rounded-2xl border transition-all shrink-0 ${currentCat === c.id ? 'bg-red-50 border-zomato-red text-zomato-red' : 'bg-white border-zomato-border text-gray-700'}">
      <span class="text-xl">${c.icon}</span>
      <span class="text-xs font-black whitespace-nowrap">${c.name}</span>
    </button>
  `).join('');
}

function setCategory(id) {
  currentCat = id;
  renderCategories();
  renderMenu();
}

function renderMenu() {
  const container = document.getElementById('menu');
  if (!container) return;
  const list = DISHES.filter(d => currentCat === 'all' || d.cat === currentCat);

  container.innerHTML = `
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
      ${list.map(d => {
        const inCart = cart.find(i => i.id === d.id);
        return `
          <div class="bg-white rounded-2xl border border-zomato-border p-4 flex flex-col justify-between shadow-sm">
            <div>
              <span class="inline-flex items-center justify-center w-4 h-4 border-2 border-green-600 rounded-sm bg-white"><span class="w-2 h-2 rounded-full bg-green-600"></span></span>
              <h4 class="font-extrabold text-base text-gray-800 mt-2">${d.name}</h4>
              <p class="text-xs text-gray-500 mt-1">${d.desc}</p>
            </div>
            <div class="flex items-center justify-between mt-4 pt-3 border-t border-gray-100">
              <span class="text-base font-black">₹${d.price}</span>${inCart ? `
                <div class="flex items-center gap-2 bg-red-50 border border-zomato-red rounded-xl px-2 py-1 text-zomato-red font-black text-xs">
                  <button onclick="changeQty('${d.id}', -1)">-</button>
                  <span>${inCart.qty}</span>
                  <button onclick="changeQty('${d.id}', 1)">+</button>
                </div>
              ` : `
                <button onclick="addToCart('${d.id}')" class="bg-white text-zomato-red border border-zomato-red px-4 py-1.5 rounded-xl font-black text-xs">ADD</button>
              `}
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function addToCart(id) {
  const d = DISHES.find(i => i.id === id);
  if (!d) return;
  const existing = cart.find(i => i.id === id);
  if (existing) existing.qty += 1;
  else cart.push({ ...d, qty: 1 });
  saveCart();
  renderMenu();
  updateCartUI();
}

function changeQty(id, delta) {
  const existing = cart.find(i => i.id === id);
  if (!existing) return;
  existing.qty += delta;
  if (existing.qty <= 0) cart = cart.filter(i => i.id !== id);
  saveCart();
  renderMenu();
  updateCartUI();
}

function saveCart() {
  localStorage.setItem('hs_cart', JSON.stringify(cart));
}

function updateCartUI() {
  const totalCount = cart.reduce((acc, i) => acc + i.qty, 0);
  const subtotal = cart.reduce((acc, i) => acc + (i.price * i.qty), 0);
  const fee = totalCount > 0 ? 25 : 0;
  const total = subtotal + fee;

  const countEl = document.getElementById('cCount');
  if (countEl) countEl.innerText = totalCount;

  const cSubtotal = document.getElementById('cSubtotal');
  const cFee = document.getElementById('cFee');
  const cTotal = document.getElementById('cTotal');
  if (cSubtotal) cSubtotal.innerText = `₹${subtotal}`;
  if (cFee) cFee.innerText = `₹${fee}`;
  if (cTotal) cTotal.innerText = `₹${total}`;

  const cItems = document.getElementById('cItems');
  if (cItems) {
    if (cart.length === 0) cItems.innerHTML = `<div class="text-center py-8 text-gray-400 text-xs">Your cart is empty.</div>`;
    else {
      cItems.innerHTML = cart.map(i => `
        <div class="flex items-center justify-between py-2 border-b">
          <div>
            <p class="text-xs font-black">${i.name}</p>
            <p class="text-[10px] text-gray-400 font-bold">₹${i.price} × ${i.qty}</p>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="changeQty('${i.id}', -1)" class="w-6 h-6 border rounded font-black text-xs">-</button>
            <span class="text-xs font-black">${i.qty}</span>
            <button onclick="changeQty('${i.id}', 1)" class="w-6 h-6 border rounded font-black text-xs">+</button>
          </div>
        </div>
      `).join('');
    }
  }
}

function toggleCart(open) {
  const drawer = document.getElementById('drawer');
  if (open) drawer?.classList.remove('hidden');
  else drawer?.classList.add('hidden');
}

function toggleSaved() {
  // Saved drawer trigger placeholder
}

function openPaymentModal() {
  if (cart.length === 0) return;
  const subtotal = cart.reduce((acc, i) => acc + (i.price * i.qty), 0);
  const total = subtotal + 25;
  document.getElementById('modalPayTotal').innerText = `₹${total}`;
  toggleCart(false);
  document.getElementById('payModal')?.classList.remove('hidden');
  document.getElementById('payModal')?.classList.add('flex');
}

function closePaymentModal() {
  document.getElementById('payModal')?.classList.add('hidden');
  document.getElementById('payModal')?.classList.remove('flex');
  document.getElementById('payInitView')?.classList.remove('hidden');
  document.getElementById('payQrView')?.classList.add('hidden');
}

async function payNow() {
  const method = document.querySelector('input[name="payMethod"]:checked')?.value || 'youpi';
  const subtotal = cart.reduce((acc, i) => acc + (i.price * i.qty), 0);
  const total = subtotal + 25;
  const orderId = 'HS' + Date.now();
  currentActiveOrderId = orderId;

  if (method === 'cod') {
    closePaymentModal();
    handlePaymentSuccess(orderId, 'CASH-ON-DELIVERY');
    return;
  }

  const btn = document.getElementById('confirmPayBtn');
  btn.disabled = true;
  btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i><span>Generating UPI...</span>`;

  try {
    const res = await fetch('/api/payments/create', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        orderId: orderId,
        amount: total,
        customerPhone: '9462942290',
        customerName: 'Hungerr Customer',
        branch: 'Borkheda, Kota',
        items: cart,
      }),
    });

    const data = await res.json();
    if (!res.ok || !data.upiUri) {
      throw new Error(data.error || 'Failed to generate UPI payment');
    }

    document.getElementById('payInitView').classList.add('hidden');
    document.getElementById('payQrView').classList.remove('hidden');

    document.getElementById('qrCodeImg').src = data.qrUrl;
    document.getElementById('upiIntentBtn').href = data.upiUri;

  } catch (err) {
    alert('Payment initialization failed: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = `<span>Pay Now</span><i class="fa-solid fa-arrow-right"></i>`;
  }
}

function submitUtrVerification() {
  const utr = document.getElementById('inputUtr')?.value.trim();
  closePaymentModal();
  handlePaymentSuccess(currentActiveOrderId, utr || 'UPI-VERIFIED');
}

function handlePaymentSuccess(orderId, utr) {
  cart = [];
  saveCart();
  renderMenu();
  updateCartUI();

  document.getElementById('trackOrderId').innerText = `Order ID: #${orderId}`;
  document.getElementById('trackUtr').innerText = utr || 'VERIFIED-UPI';
  document.getElementById('track')?.classList.remove('hidden');
  document.getElementById('track')?.classList.add('flex');
}
</script>
</body>
</html>
